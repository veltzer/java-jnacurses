# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.checker.ruff]
src_dirs = ["scripts"]


[processor.checker.mypy]
src_dirs = ["scripts"]

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile's default build was a single shared library:
# gcc -shared -fpic -o libjnacurses.so jnacurses.c -lcurses.
# scripts/build_lib.py runs that; the explicit processor keys it on the source
# and declares the .so as the output. (The Makefile's install target was a
# separate `sudo install` to /usr/lib -- a deploy action, not a build.)
[processor.explicit.generic.lib]
command = "scripts/build_lib.py"
inputs = ["jnacurses.c"]
output_files = ["libjnacurses.so"]

# curses headers/lib for the shared object.
[dependencies]
system = [
    "libncurses-dev",
]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── c / c++ ─────────────────────────────────────────────────────────────────

[processor.checker.cppcheck]
src_files = ["jnacurses.c"]
args = [
	"--error-exitcode=1",
	"--enable=warning,style,performance,portability",
	"--inline-suppr",
]
